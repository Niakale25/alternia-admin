@if (ouvert) {
  <div class="modale-arriere-plan" (click)="clicArrierePlan($event)" role="dialog" aria-modal="true">
    <div class="modale" [style.max-width]="largeurMax">
      <!-- En-tête de la modale -->
      <div class="modale__en-tete">
        <div>
          <h2 class="modale__titre">{{ titre }}</h2>
          @if (sousTitre) {
            <p class="modale__sous-titre">{{ sousTitre }}</p>
          }
        </div>
        <button class="modale__fermer" (click)="fermer.emit()" aria-label="Fermer la boîte de dialogue">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Corps du contenu -->
      <div class="modale__corps">
        <ng-content select="[corps]"></ng-content>
        <ng-content></ng-content>
      </div>

      <!-- Pied d'actions -->
      <div class="modale__pied">
        <ng-content select="[pied]"></ng-content>
      </div>
    </div>
  </div>
}
