<div class="stat-card card">
  <div class="stat-card__top">
    <div class="stat-card__titre">{{ titre }}</div>
  </div>

  <div class="stat-card__body">
    @if (iconeSvg) {
      <div class="stat-card__icone" [style.color]="couleurAccent" [innerHTML]="iconeSvg | htmlSecurise"></div>
    }
    <div class="stat-card__valeur" [style.color]="couleurAccent">{{ valeur }}</div>
  </div>

  @if (sousTexte) {
    <div class="stat-card__sous-texte">{{ sousTexte }}</div>
  }
</div>
