<app-fenetre-modale
  [ouvert]="ouvert"
  titre="Nouvel Abonnement Parent B2C"
  sousTitre="Souscription directe d'une formule d'accompagnement familial"
  (fermer)="fermer.emit()"
>
  <div class="form-grid" corps>
    <div class="form-group full-width">
      <label class="form-label">Nom du Parent / Tuteur *</label>
      <input
        type="text"
        class="input"
        placeholder="Ex: Fatoumata Coulibaly"
        [(ngModel)]="parentNom"
        required
      />
    </div>

    <div class="form-group full-width">
      <label class="form-label">Email du Parent *</label>
      <input
        type="email"
        class="input"
        placeholder="parent@orange.ml"
        [(ngModel)]="parentEmail"
        required
      />
    </div>

    <div class="form-group">
      <label class="form-label">Formule</label>
      <select class="select" [ngModel]="type" (ngModelChange)="onTypeChange($event)">
        <option value="Premium Famille">Premium Famille (45 000 FCFA / an ou 5 000 FCFA / mois)</option>
        <option value="Premium Établissement">Premium Établissement (250 000 FCFA / an)</option>
        <option value="Accès Général (Inclus Boîtier)">Accès Général (Inclus Boîtier - 0 FCFA)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Montant (FCFA)</label>
      <input type="number" class="input" [(ngModel)]="montant" />
    </div>

    <div class="form-group">
      <label class="form-label">Date de Prochain Renouvellement</label>
      <input type="text" class="input" [(ngModel)]="dateRenouvellement" />
    </div>

    <div class="form-group full-width flex items-center gap-2 mt-2">
      <input type="checkbox" id="autoRenouv" [(ngModel)]="autoRenouvellement" />
      <label for="autoRenouv" class="form-label cursor-pointer" style="margin: 0;">Renouvellement automatique</label>
    </div>

  </div>

  <div class="flex gap-2" pied>
    <button class="btn btn--secondary" (click)="fermer.emit()">Annuler</button>
    <button
      class="btn btn--primary"
      [disabled]="!parentNom.trim() || !parentEmail.trim()"
      (click)="valider()"
    >
      Activer l'Abonnement
    </button>
  </div>
</app-fenetre-modale>
