<app-fenetre-modale
  [ouvert]="ouvert"
  titre="Ajouter un Établissement Scolaire"
  sousTitre="Enregistrement d'un nouveau centre scolaire partenaire au Mali"
  (fermer)="fermer.emit()"
>
  <div class="form-grid" corps>
    <div class="form-group full-width">
      <label class="form-label">Nom de l'établissement *</label>
      <input
        type="text"
        class="input"
        placeholder="Ex: Complexe Scolaire Horizon Bamako"
        [(ngModel)]="nouveauNom"
        required
      />
    </div>

    <div class="form-group">
      <label class="form-label">Région</label>
      <select class="select" [(ngModel)]="nouvelleRegion">
        <option value="District de Bamako">District de Bamako</option>
        <option value="Sikasso">Sikasso</option>
        <option value="Ségou">Ségou</option>
        <option value="Koulikoro">Koulikoro</option>
        <option value="Kayes">Kayes</option>
        <option value="Mopti">Mopti</option>
        <option value="Gao & Tombouctou">Gao & Tombouctou</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Ville</label>
      <input type="text" class="input" [(ngModel)]="nouvelleVille" />
    </div>

    <div class="form-group full-width">
      <label class="form-label">Email de la direction</label>
      <input
        type="email"
        class="input"
        placeholder="direction@ecole.ml"
        [(ngModel)]="nouveauDirecteurEmail"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Offre souscrite</label>
      <select class="select" [(ngModel)]="nouvelleOffre">
        <option value="Standard">Standard</option>
        <option value="Institutionnel">Institutionnel</option>
        <option value="Enterprise">Enterprise</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Boîtiers initiaux</label>
      <input type="number" class="input" [(ngModel)]="nouveauxBoitiersCount" min="1" />
    </div>
  </div>

  <div class="flex gap-2" pied>
    <button class="btn btn--secondary" (click)="fermer.emit()">Annuler</button>
    <button class="btn btn--primary" [disabled]="!nouveauNom.trim()" (click)="validerFormulaire()">
      Créer l'Établissement
    </button>
  </div>
</app-fenetre-modale>
