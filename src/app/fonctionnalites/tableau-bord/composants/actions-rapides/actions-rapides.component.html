<div class="card tdb-actions-card">
  <h3 class="tdb-actions-card__title">Raccourcis Opérationnels</h3>
  <div class="tdb-actions-grid">
    <a routerLink="/etablissements" class="action-btn">
      <div class="action-btn__icon action-btn__icon--brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <div class="action-btn__text">
        <span class="action-btn__label">Nouvel Établissement</span>
        <span class="action-btn__desc">Enregistrer un centre scolaire</span>
      </div>
    </a>

    <a routerLink="/boitiers" class="action-btn">
      <div class="action-btn__icon action-btn__icon--cyan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>
        </svg>
      </div>
      <div class="action-btn__text">
        <span class="action-btn__label">Associer un Boîtier</span>
        <span class="action-btn__desc">Déploiement classe connectée</span>
      </div>
    </a>

    <a routerLink="/licences" class="action-btn">
      <div class="action-btn__icon action-btn__icon--accent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
      </div>
      <div class="action-btn__text">
        <span class="action-btn__label">Générer un Pack</span>
        <span class="action-btn__desc">Licences en lot institutionnel</span>
      </div>
    </a>

    <a routerLink="/statistiques" class="action-btn">
      <div class="action-btn__icon action-btn__icon--success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
        </svg>
      </div>
      <div class="action-btn__text">
        <span class="action-btn__label">Rapports & Audit</span>
        <span class="action-btn__desc">Statistiques pédagogiques</span>
      </div>
    </a>
  </div>
</div>
