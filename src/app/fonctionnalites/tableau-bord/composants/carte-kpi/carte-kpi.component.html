<div class="card tdb-kpi-card" [style.--kpi-color]="kpi.couleur">
  <div class="tdb-kpi-card__top">
    <div class="tdb-kpi-card__icon" [innerHTML]="kpi.icon | htmlSecurise"></div>
    <div class="tdb-kpi-card__label">{{ kpi.label }}</div>
  </div>
  <div class="tdb-kpi-card__valeur">{{ kpi.valeur }}</div>
  <div class="tdb-kpi-card__sous">{{ kpi.sousTexte }}</div>
</div>
