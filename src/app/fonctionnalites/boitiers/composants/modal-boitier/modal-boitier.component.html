<app-fenetre-modale
  [ouvert]="ouvert"
  titre="Associer un Boîtier AlternIA"
  sousTitre="Enregistrement matériel, configuration Edge et affectation scolaire"
  (fermer)="fermer.emit()"
>
  <div class="form-grid" corps>
    <div class="form-group full-width">
      <label class="form-label">Numéro de Série Matériel *</label>
      <input
        type="text"
        class="input font-mono"
        placeholder="Ex: ALT-BOX-V2-5520-ML"
        [(ngModel)]="serialNumber"
        required
      />
    </div>

    <div class="form-group">
      <label class="form-label">Modèle Hardware</label>
      <select class="select" [(ngModel)]="modele">
        <option value="AlternIA Box v2.0 Pro">AlternIA Box v2.0 Pro (Raspberry Pi 5 + 64Go)</option>
        <option value="AlternIA Box v2.0 Edge">AlternIA Box v2.0 Edge (Raspberry Pi 4 + 32Go)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Capacité Stockage SSD</label>
      <select class="select" [(ngModel)]="stockageGo">
        <option [ngValue]="32">32 Go SSD</option>
        <option [ngValue]="64">64 Go SSD (Recommandé)</option>
        <option [ngValue]="128">128 Go SSD (Full IA)</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label class="form-label">Établissement d'affectation</label>
      <input type="text" class="input" [(ngModel)]="etablissementNom" />
    </div>

    <div class="form-group">
      <label class="form-label">Ville de déploiement</label>
      <input type="text" class="input" [(ngModel)]="ville" />
    </div>

    <div class="form-group">
      <label class="form-label">Région</label>
      <select class="select" [(ngModel)]="region">
        <option value="Bamako">Bamako</option>
        <option value="Sikasso">Sikasso</option>
        <option value="Ségou">Ségou</option>
        <option value="Kayes">Kayes</option>
        <option value="Mopti">Mopti</option>
        <option value="Tombouctou">Tombouctou</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Mode Réseau</label>
      <select class="select" [(ngModel)]="modeFonctionnement">
        <option value="Point d'Accès Local">Point d'Accès Local (Hotspot WiFi)</option>
        <option value="100% Offline Edge">100% Offline Edge (Autonome)</option>
        <option value="Hybride Sync Cloud">Hybride Sync Cloud (Planifiée)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Version Firmware</label>
      <input type="text" class="input font-mono" [(ngModel)]="versionFirmware" />
    </div>

    <div class="form-group full-width">
      <label class="form-label">Statut Initial</label>
      <select class="select" [(ngModel)]="statut">
        <option value="Actif">Actif (Connecté en classe)</option>
        <option value="Hors ligne">Hors ligne (En transit / Stock)</option>
        <option value="Maintenance">Maintenance</option>
      </select>
    </div>
  </div>

  <div class="flex gap-2" pied>
    <button class="btn btn--secondary" (click)="fermer.emit()">Annuler</button>
    <button class="btn btn--primary" [disabled]="!serialNumber.trim()" (click)="valider()">
      Associer le Boîtier
    </button>
  </div>
</app-fenetre-modale>
