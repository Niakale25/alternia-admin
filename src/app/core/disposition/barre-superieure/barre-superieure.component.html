<header class="topbar">
  <!-- Zone Gauche : Bouton menu mobile + Fil d'Ariane épuré -->
  <div class="topbar__left">
    <button
      type="button"
      class="topbar__toggle-sidebar-btn"
      [class.topbar__toggle-sidebar-btn--visible]="barreRepliee"
      (click)="basculerBarre.emit()"
      [title]="barreRepliee ? 'Déplier la barre latérale' : 'Replier la barre latérale'"
      [attr.aria-label]="barreRepliee ? 'Déplier la barre latérale' : 'Replier la barre latérale'"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>
      </svg>
    </button>

    <div class="topbar__breadcrumb">
      <span class="topbar__app-name">Alternia</span>
      <span class="topbar__separator">/</span>
      <span class="topbar__page-title">{{ titrePage() }}</span>
    </div>
  </div>

  <!-- Zone Droite : Thème + Notifications + Profil Super Admin + Déconnexion -->
  <div class="topbar__right">

    <!-- Sélecteur Thème Sombre / Clair -->
    <button
      type="button"
      class="topbar__icon-btn"
      (click)="themeService.basculerTheme()"
      [attr.aria-label]="themeService.estModeSombre() ? 'Passer au mode clair' : 'Passer au mode sombre'"
      [title]="themeService.estModeSombre() ? 'Passer au mode clair' : 'Passer au mode sombre'"
    >
      @if (themeService.estModeSombre()) {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      } @else {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      }
    </button>

    <!-- Centre de notifications et alertes -->
    <a
      class="topbar__icon-btn"
      routerLink="/notifications"
      title="Centre de notifications et alertes"
      aria-label="Voir toutes les notifications"
    >
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      @if (notificationService.totalNonLues() > 0) {
        <span class="topbar__badge-count">{{ notificationService.totalNonLues() }}</span>
      }
    </a>

    <div class="topbar__divider"></div>

    <!-- Profil Super Admin -->
    <div class="topbar__user" title="Connecté en tant que Super Administrateur">
      <div class="topbar__avatar">
        {{ initiales() }}
      </div>
      <div class="topbar__user-info">
        <span class="topbar__user-name">{{ authService.adminInfo()?.nom || 'Super Admin' }}</span>
        <span class="topbar__user-role">Super Admin</span>
      </div>
    </div>

    <!-- Bouton Déconnexion sécurisé -->
    <button
      type="button"
      class="topbar__icon-btn topbar__icon-btn--logout"
      (click)="authService.seDeconnecter()"
      title="Déconnexion de la session"
      aria-label="Se déconnecter"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" x2="9" y1="12" y2="12"/>
      </svg>
    </button>

  </div>
</header>
