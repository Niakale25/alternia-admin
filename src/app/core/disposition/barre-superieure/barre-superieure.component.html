<header class="topbar">
  <!-- Zone Gauche : Bouton menu mobile + Recherche globale -->
  <div class="topbar__left">
    <button class="topbar__menu-btn" (click)="basculerBarre.emit()" aria-label="Basculer le menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="topbar__search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="text"
        placeholder="Rechercher un établissement, parent, boîtier..."
        [value]="rechercheTexte()"
        (input)="onRecherche($any($event))"
        aria-label="Recherche globale Alternia"
      />
      <span class="topbar__search-kbd">⌘K</span>
    </div>
  </div>

  <!-- Zone Droite : Badge Statut + Thème + Alertes + Accès Rapide -->
  <div class="topbar__right">
    <!-- Statut plateforme -->
    <div class="topbar__platform-badge">
      <span class="topbar__status-dot"></span>
      <span class="topbar__platform-text">Réseau Alternia Opérationnel</span>
    </div>

    <!-- Sélecteur Thème Sombre / Clair -->
    <button
      class="topbar__icon-btn"
      (click)="themeService.basculerTheme()"
      [attr.aria-label]="themeService.estModeSombre() ? 'Passer au mode clair' : 'Passer au mode sombre'"
    >
      @if (themeService.estModeSombre()) {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      }
    </button>

    <!-- Bouton Alertes / Notifications -->
    <button
      class="topbar__icon-btn"
      (click)="declencherNotificationDemo()"
      aria-label="Voir les notifications"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      <span class="topbar__badge-dot"></span>
    </button>

    <div class="topbar__divider"></div>

    <!-- Avatar Super Admin -->
    <a routerLink="/parametres" class="topbar__avatar-btn" aria-label="Mon profil administrateur">
      <div class="topbar__avatar">SA</div>
    </a>
  </div>
</header>
